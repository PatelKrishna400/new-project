<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Earner — Webtask</title>
  <script>
    // Initialize local defaults only if not already set, preserving real balances
    try {
      if (localStorage.getItem('task_game_coins') === null) localStorage.setItem('task_game_coins', '0');
      if (localStorage.getItem('task_game_stars') === null) localStorage.setItem('task_game_stars', '0');
      if (localStorage.getItem('user_coins') === null) localStorage.setItem('user_coins', localStorage.getItem('task_game_coins') || '0');
      if (localStorage.getItem('user_stars') === null) localStorage.setItem('user_stars', localStorage.getItem('task_game_stars') || '0');
      if (localStorage.getItem('completed_tasks_count') === null) localStorage.setItem('completed_tasks_count', '0');
      if (localStorage.getItem('ads_watched_count') === null) localStorage.setItem('ads_watched_count', '0');

      if (!localStorage.getItem('task_game_legacy_mock_cleared')) {
        localStorage.removeItem('ENERGY_TAP_SUNFLOWER_STATE_V4');
        localStorage.removeItem('sunflower_state');
        localStorage.removeItem('task_game_stars_rating');
        const existingName = localStorage.getItem('player_username');
        if (!existingName || existingName.toLowerCase().includes('nova') || existingName === 'Demo User') {
          localStorage.setItem('player_username', 'Player');
        }
        if (!localStorage.getItem('player_avatar')) {
          localStorage.setItem('player_avatar', '⚡');
        }
        localStorage.setItem('task_game_legacy_mock_cleared', 'true');
      }
    } catch (e) {}
  </script>
  <!-- Firebase SDK & Analytics Connection -->
  <script type="module" src="frontend/firebase-config.js"></script>
  <style>

    /* Global Scrollbar Hiding */
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }
    /* Suppression of Session badges, top-up cards, and leaderboard prize/lock cards per user request */
    .session-tab-mini-badge,
    .event-live-indicator,
    .player-session-badge,
    .tg-wallet-topup-strip,
    .tg-stars-store-container,
    .btn-tg-buy-mini,
    .leaderboard-prizes-card,
    .qualification-card {
      display: none !important;
    }

    body {
      background-color: #030816;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* Loading Page: Completely Removed */
    .app-loading-overlay {
      display: none !important;
    }

    .app-loading-overlay.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .loading-content-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      max-width: 320px;
      width: 90%;
    }

    .loading-logo-ring {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .loading-ring-spinner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-right-color: #facc15;
      animation: loadingSpin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    @keyframes loadingSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-logo-core {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(155deg, #1d4ed8 0%, #0b1a3d 100%);
      border: 1.5px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.6);
      animation: corePulse 1.8s ease-in-out infinite;
    }

    @keyframes corePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(56, 189, 248, 0.8), 0 0 50px rgba(250, 204, 21, 0.4); }
    }

    .loading-app-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.08em;
      margin: 0;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }

    .loading-subtitle {
      font-size: 0.72rem;
      color: #38bdf8;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.25rem;
      margin-bottom: 1.5rem;
    }

    .loading-progress-track {
      width: 100%;
      height: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
      margin-bottom: 0.75rem;
    }

    .loading-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1d4ed8 0%, #38bdf8 60%, #facc15 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      transition: width 0.2s ease-out;
    }

    .loading-status-text {
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 600;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 0.02em;
    }

    /* Mobile Screen Viewport Container */
    .mobile-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: #060e24;
      border-left: 1px solid rgba(56, 189, 248, 0.15);
      border-right: 1px solid rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(56, 189, 248, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
    }

    /* Top Header Bar */
    .home-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 14, 36, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .user-meta {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-size: 0.875rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .user-level {
      font-size: 0.68rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.04em;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .coin-pill,
    .star-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #0a1738;
      border: 1.5px solid #38bdf8;
      padding: 0.32rem 0.75rem;
      border-radius: 9999px;
      font-weight: 800;
      color: #fbbf24;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .coin-pill:hover,
    .star-pill:hover {
      transform: translateY(-1.5px) scale(1.04);
      filter: brightness(1.15);
    }

    .coin-pill:active,
    .star-pill:active {
      transform: scale(0.95);
    }

    .star-pill {
      border-color: #facc15;
      color: #facc15;
      background: linear-gradient(135deg, #221803 0%, #0a1738 100%);
      box-shadow: 0 2px 10px rgba(250, 204, 21, 0.25);
    }

    /* Tasks Main Content */
    .page-content {
      flex: 1;
      padding: 1.2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .tasks-banner {
      margin-bottom: 0.2rem;
    }

    .tasks-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .tasks-subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* Tasks List */
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-card {
      background: #0a1738;
      border: 1px solid rgba(56, 189, 248, 0.14);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      transition: all 0.2s ease;
    }

    .task-card:hover {
      background: #0f1f4a;
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    .task-card.completed {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.05);
    }

    .task-card.cooling-down {
      border-color: rgba(245, 158, 11, 0.25);
      background: rgba(15, 23, 42, 0.7);
    }

    .task-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .task-name-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .task-name {
      font-size: 0.875rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-status-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .task-status-pill.ready {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .task-status-pill.cooling {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .task-desc-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
    }

    .task-reward {
      font-size: 0.75rem;
      font-weight: 800;
      color: #fbbf24;
      flex-shrink: 0;
    }

    .task-desc-sep {
      color: #475569;
    }

    .task-desc-text {
      color: #94a3b8;
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Proper 3D Gray Action Button with #848683 palette */
    .btn-claim {
      background: linear-gradient(155deg, #9ca09b 0%, #848683 45%, #696b68 100%);
      color: #ffffff;
      border: 1.5px solid;
      border-color: #b3b7b2 #848683 #535552 #717370;
      border-radius: 8px;
      padding: 0.45rem 0.95rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.35), inset 0 -1.5px 2px rgba(0, 0, 0, 0.5);
      font-family: inherit;
      min-width: 75px;
      text-align: center;
    }

    .btn-claim:hover:not(:disabled) {
      background: linear-gradient(155deg, #a8aca7 0%, #8f928e 45%, #727471 100%);
      border-color: #c4c8c3 #9ca09b #5e605d #848683;
      transform: translateY(-1px);
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.55), inset 0 1.5px 1px rgba(255, 255, 255, 0.45), inset 0 -1.5px 2px rgba(0, 0, 0, 0.5);
    }

    .btn-claim:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7), inset 0 -1px 1px rgba(255, 255, 255, 0.15);
    }

    .btn-claim:disabled {
      background: #1e293b !important;
      border-color: #10b981 !important;
      color: #10b981 !important;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-claim.btn-timer-cooling {
      border-color: rgba(245, 158, 11, 0.45) !important;
      color: #fcd34d !important;
      background: #172033 !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
      font-size: 0.75rem !important;
      min-width: 90px;
    }

    /* Empty state */
    .empty-tasks-box {
      text-align: center;
      padding: 2rem 1rem;
      background: rgba(10, 23, 56, 0.6);
      border: 1px dashed rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      color: #94a3b8;
    }
    .empty-tasks-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .empty-tasks-text {
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Floating coin animation */
    @keyframes floatCoin {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-30px) scale(1.3); opacity: 0; }
    }
    .floating-coin {
      position: absolute;
      color: #fbbf24;
      font-weight: 800;
      font-size: 1rem;
      pointer-events: none;
      animation: floatCoin 0.8s ease-out forwards;
      z-index: 9999;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }

    /* ==========================================================================
       PROPER ANIMATED 3D BLUE MENU BAR (DYNAMIC MULTI-COLOR & LIGHT ANIMATIONS)
       ========================================================================== */
    .below-menu-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      height: 74px;
      background: linear-gradient(180deg, rgba(8, 18, 48, 0.94) 0%, rgba(3, 8, 22, 0.98) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
      border-left: 1px solid rgba(56, 189, 248, 0.2);
      border-right: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 
        0 -10px 28px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 0.35rem;
      z-index: 1000;
      overflow: visible;
      animation: menuBarAmbientPulse 6s ease-in-out infinite;
    }

    /* Ambient pulse on bottom menu bar (clean subtle shadow without colorful lines) */
    @keyframes menuBarAmbientPulse {
      0%, 100% {
        box-shadow: 
          0 -10px 28px rgba(0, 0, 0, 0.88),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      50% {
        box-shadow: 
          0 -12px 32px rgba(0, 0, 0, 0.95),
          inset 0 1px 0 rgba(56, 189, 248, 0.15);
      }
    }

    .below-menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      background: none;
      border: none;
      color: #94a3b8;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0.3rem 0.35rem 0.45rem 0.35rem;
      border-radius: 12px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-decoration: none;
      flex: 1;
      position: relative;
    }

    .below-menu-item:hover .menu-label {
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
    }

    /* 3D Blue Menu Icon Disc with Dynamic Hover Lighting */
    .menu-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(155deg, #1d4ed8 0%, #1e3a8a 40%, #0b1a3d 100%);
      border: 1.5px solid;
      border-color: #60a5fa #2563eb #06112c #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0f2fe;
      box-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.6),
        inset 0 1.5px 1px rgba(147, 197, 253, 0.5),
        inset 0 -2px 3px rgba(0, 0, 0, 0.7),
        0 0 10px rgba(37, 99, 235, 0.2);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .below-menu-item:hover .menu-icon-wrap {
      background: linear-gradient(155deg, #2563eb 0%, #1d4ed8 45%, #172554 100%);
      border-color: #93c5fd #3b82f6 #0c1a3d #2563eb;
      transform: translateY(-3px) scale(1.08);
      box-shadow: 
        0 8px 18px rgba(0, 0, 0, 0.75),
        inset 0 2px 1.5px rgba(191, 219, 254, 0.7),
        inset 0 -2px 3px rgba(0, 0, 0, 0.6),
        0 0 22px rgba(56, 189, 248, 0.65);
      color: #ffffff;
    }

    .below-menu-item:active .menu-icon-wrap {
      transform: translateY(1px) scale(0.93);
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.85),
        inset 0 -1px 1px rgba(147, 197, 253, 0.2),
        0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* Active 3D Blue Menu Item (Pulsing Animated Multi-Color Glow: Gold to Cyan) */
    .below-menu-item.active .menu-icon-wrap {
      background: linear-gradient(155deg, #1e40af 0%, #1d4ed8 40%, #0c1e4a 100%);
      color: #facc15;
      transform: translateY(-2px);
      animation: activeTabColorCyclePulse 2.8s ease-in-out infinite;
    }

    @keyframes activeTabColorCyclePulse {
      0%, 100% {
        color: #facc15;
        border-color: #fef08a #facc15 #854d0e #ca8a04;
        box-shadow: 
          0 4px 14px rgba(0, 0, 0, 0.7),
          inset 0 1.5px 1.5px rgba(254, 240, 138, 0.75),
          inset 0 -2px 3px rgba(0, 0, 0, 0.75),
          0 0 18px rgba(250, 204, 21, 0.75),
          0 0 30px rgba(234, 179, 8, 0.4);
      }
      50% {
        color: #38bdf8;
        border-color: #bae6fd #38bdf8 #0369a1 #0284c7;
        box-shadow: 
          0 6px 20px rgba(0, 0, 0, 0.8),
          inset 0 2px 2px rgba(186, 230, 253, 0.85),
          inset 0 -2px 3px rgba(0, 0, 0, 0.75),
          0 0 24px rgba(56, 189, 248, 0.85),
          0 0 42px rgba(14, 165, 233, 0.5);
      }
    }

    .below-menu-item.active .menu-icon-wrap svg {
      animation: activeSvgFilterPulse 2.8s ease-in-out infinite;
    }

    @keyframes activeSvgFilterPulse {
      0%, 100% {
        filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.9));
      }
      50% {
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.95));
      }
    }

    .below-menu-item.active .menu-label {
      animation: activeTextColorPulse 2.8s ease-in-out infinite;
    }

    @keyframes activeTextColorPulse {
      0%, 100% {
        color: #facc15;
        text-shadow: 0 0 8px rgba(250, 204, 21, 0.75), 0 0 16px rgba(234, 179, 8, 0.4);
      }
      50% {
        color: #38bdf8;
        text-shadow: 0 0 10px rgba(56, 189, 248, 0.9), 0 0 20px rgba(14, 165, 233, 0.5);
      }
    }

    /* Active Glowing Neon Pip Indicator with Color Flow */
    .below-menu-item.active::after {
      content: '';
      position: absolute;
      bottom: 2px;
      width: 16px;
      height: 3.5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #00f0ff, #facc15, #ec4899, #00f0ff);
      background-size: 250% 100%;
      box-shadow: 0 0 8px #facc15, 0 0 14px #00f0ff;
      animation: activePipColorShift 3s linear infinite, activePipPulse 2.4s ease-in-out infinite;
    }

    @keyframes activePipColorShift {
      0% { background-position: 0% 0; }
      100% { background-position: 250% 0; }
    }

    @keyframes activePipPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.85; }
      50% { transform: scaleX(1.35); opacity: 1; filter: brightness(1.3); }
    }

    .menu-label {
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition: color 0.25s ease, text-shadow 0.25s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Center Elevated 3D Blue Tab (Home) */
    .center-home-btn {
      position: relative;
      top: -12px;
      flex: 1.15;
    }

    .center-home-icon-wrap {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(155deg, #2563eb 0%, #1d4ed8 35%, #0b1a3d 100%);

  <!-- 6-Digit Code Task Verification Modal -->
  <div class="task-verify-modal-overlay" id="taskVerifyModalOverlay" style="display: none;" onclick="handleVerifyModalBackdropClick(event)">

      <div class="verify-modal-header">
        <div class="verify-modal-badge">
          <span class="verify-badge-dot"></span>
          <span>WEBTASK VERIFICATION</span>
        </div>
        <h2 class="verify-modal-title">Enter 6-Digit Code</h2>
        <div class="verify-modal-reward-badge">
          <span>Fixed Reward:</span>
          <span class="reward-highlight">+5 ⭐</span>

      <div class="verify-modal-task-card">
        <div class="verify-card-icon" id="verifyModalTaskIcon">⚡</div>

            inputmode="numeric" 
            placeholder="000000" 
            autocomplete="off"
            required
            oninput="handleVerifyCodeInput(this)"
          >
          <div class="verify-code-hint">Enter the 6-digit verification code for this task</div>
          <div class="verify-error-msg" id="verifyErrorMsg" style="display: none;"></div>
        </div>

        <div class="verify-modal-btn-row">
          <button type="button" class="btn-verify-cancel" onclick="closeVerifyModal()">Cancel</button>
          <button type="submit" class="btn-verify-confirm" id="btnVerifyConfirm">Verify &amp; Win 5 ⭐</button>
        </div>

  <script>
    if (localStorage.getItem('task_game_coins') === '2450' || !localStorage.getItem('task_game_coins')) {
      localStorage.setItem('task_game_coins', '0');
    }
    if (localStorage.getItem('task_game_stars') === '850' || !localStorage.getItem('task_game_stars')) {
      localStorage.setItem('task_game_stars', '0');
    }
    let userCoins = parseInt(localStorage.getItem('task_game_coins') || '0', 10);
    let userStars = parseInt(localStorage.getItem('task_game_stars') || '0', 10);

    // Storage Keys & Sync Channels
    const TASKS_STORAGE_KEY = 'task_game_tasks';
    const CLAIMS_STORAGE_KEY = 'task_game_claims';
    const COMPLETED_TASKS_KEY = 'task_game_completed_tasks';
    const SYNC_FLAG_KEY = 'task_game_sync_flag';
    const SYNC_CHANNEL_NAME = 'nova_task_sync';

    // Default tasks: empty by default; managed directly from Admin Panel
    const DEFAULT_TASKS = [];

    function getStoredTasks() {
      try {
        const raw = localStorage.getItem(TASKS_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            // Purge any legacy demo sponsor tasks
            const cleaned = parsed.filter(t => t && t.id && !t.id.startsWith('task_sponsor_') && !String(t.title || '').toLowerCase().includes('sponsor'));
            if (cleaned.length !== parsed.length) {
              localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(cleaned));
            }
            return cleaned;
          }
        }
        localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify([]));
        return [];
      } catch (e) {}
      return [];
    }

    function getStoredCompletedTasks() {
      try {
        const raw = localStorage.getItem(COMPLETED_TASKS_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {};
    }

    function markTaskCompleted(taskId) {
      const completed = getStoredCompletedTasks();
      completed[taskId] = { completedAt: Date.now(), rewardStars: 5 };
      localStorage.setItem(COMPLETED_TASKS_KEY, JSON.stringify(completed));
      localStorage.removeItem('task_opened_' + taskId);
      localStorage.setItem(SYNC_FLAG_KEY, Date.now().toString());
      try {
        const ch = new BroadcastChannel(SYNC_CHANNEL_NAME);
        ch.postMessage({ type: 'TASK_COMPLETED', taskId, timestamp: Date.now() });
      } catch (e) {}
    }

    function isTaskOpened(taskId) {
      return localStorage.getItem('task_opened_' + taskId) === 'true';
    }

    function setTaskOpened(taskId) {
      localStorage.setItem('task_opened_' + taskId, 'true');
    }

    function getStoredClaims() {
      try {
        const raw = localStorage.getItem(CLAIMS_STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {};
    }
      try {
        const raw = localStorage.getItem(CLAIMS_STORAGE_KEY);
        if (raw) {
          const claims = JSON.parse(raw);
          // Remove any lingering cooldown claims for legacy seed tasks
          ['task_1', 'task_2', 'task_3', 'task_4', 'task_5'].forEach(id => delete claims[id]);
          return claims;
        }
      } catch (e) {}
      return {};
    }

    function saveClaims(claims) {
      localStorage.setItem(CLAIMS_STORAGE_KEY, JSON.stringify(claims));
      localStorage.setItem(SYNC_FLAG_KEY, Date.now().toString());
      try {
        const ch = new BroadcastChannel(SYNC_CHANNEL_NAME);
        ch.postMessage({ type: 'CLAIMS_UPDATED', timestamp: Date.now() });
      } catch (e) {}
    }

    function getTaskRemainingSeconds(task, claims) {
      const timerSec = Number(task.timerSeconds);
      if (isNaN(timerSec) || timerSec <= 0) {
        return claims[task.id] ? -999 : 0;
      }
      const claimedAt = claims[task.id];
      if (!claimedAt) return 0;
      const elapsed = Math.floor((Date.now() - claimedAt) / 1000);
      const remaining = timerSec - elapsed;
      return remaining > 0 ? remaining : 0;
    }

    function formatRemainingTime(seconds) {
      if (seconds <= 0) return 'Ready';
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      if (hrs > 0) {
        return `${hrs}h ${mins.toString().padStart(2, '0')}m ${secs.toString().padStart(2, '0')}s`;
      }
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function formatDurationBadge(seconds) {
      const s = Number(seconds || 0);
      if (s <= 0) return 'One-time Bounty';
      const hrs = s / 3600;
      if (hrs >= 1 && Number.isInteger(hrs)) return `${hrs}h Cooldown`;
      if (hrs >= 1) return `${hrs.toFixed(1)}h Cooldown`;
      const mins = Math.floor(s / 60);
      if (mins >= 1) return `${mins}m Cooldown`;
      return `${s}s Cooldown`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Web Audio Synthesizer for Home Tasks
    const HomeAudio = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      playStartupChime() {
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + idx * 0.08);
            gain.gain.setValueAtTime(0.08, t + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + idx * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t + idx * 0.08);
            osc.stop(t + idx * 0.08 + 0.38);
          });
        } catch (e) {}
      },
      playCoinClaim() {
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(987.77, t);
          osc.frequency.setValueAtTime(1318.51, t + 0.06);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.27);
        } catch (e) {}
      }
    };

    function updateCoinDisplay() {
      userCoins = parseInt(localStorage.getItem('task_game_coins') || '0', 10);
      userStars = parseInt(localStorage.getItem('task_game_stars') || '0', 10);

      const display = document.getElementById('userCoinsDisplay');
      if (display) display.textContent = userCoins.toLocaleString();

      const starDisplay = document.getElementById('userStarsDisplay');
      if (starDisplay) starDisplay.textContent = userStars.toLocaleString();

      const avatarEl = document.querySelector('.user-avatar');
      if (avatarEl) avatarEl.textContent = localStorage.getItem('player_avatar') || '⚡';

      const nameEl = document.querySelector('.user-name');
      if (nameEl) {
        const savedName = localStorage.getItem('player_username');
        nameEl.textContent = (savedName && savedName !== 'NovaEarner' && savedName !== 'Player') ? savedName : 'Task Earner';
      }

      // Dynamic User Rank Display in Header
      const rankEl = document.getElementById('userRankDisplay') || document.querySelector('.user-level');
      if (rankEl) {
        let playerRank = 1;
        try {
          const rawUsers = localStorage.getItem('task_game_users');
          const pName = localStorage.getItem('player_username') || 'Task Earner';
          if (rawUsers) {
            let users = JSON.parse(rawUsers);
            if (Array.isArray(users) && users.length > 0) {
              users.sort((a, b) => {
                const tasksDiff = Number(b.eventTasks || 0) - Number(a.eventTasks || 0);
                if (tasksDiff !== 0) return tasksDiff;
                const coinsDiff = Number(b.coins || 0) - Number(a.coins || 0);
                if (coinsDiff !== 0) return coinsDiff;
                return Number(b.stars || 0) - Number(a.stars || 0);
              });
              const idx = users.findIndex(u => (u.name && u.name.toLowerCase() === pName.toLowerCase()) || u.id === 'usr_1');
              if (idx >= 0) playerRank = idx + 1;
            }
          }
          const savedRank = localStorage.getItem('task_game_rank') || localStorage.getItem('player_rank');
          if (savedRank) playerRank = savedRank;
        } catch (e) {}
        rankEl.textContent = `RANK #${playerRank}`;
      }

      const pill = document.getElementById('coinPill');
      if (pill) {
        pill.style.transform = 'scale(1.05)';
        setTimeout(() => { pill.style.transform = 'scale(1)'; }, 200);
      }
    }

    function showFloatingCoin(targetElement, text) {
      if (!targetElement) return;
      const rect = targetElement.getBoundingClientRect();
      const floatEl = document.createElement('div');
      floatEl.className = 'floating-coin';
      floatEl.textContent = text;
      floatEl.style.left = `${rect.left + rect.width / 4}px`;
      floatEl.style.top = `${rect.top - 8}px`;
      document.body.appendChild(floatEl);
      setTimeout(() => { floatEl.remove(); }, 800);
    }

    // Dynamic Task Rendering with Open / Verify & Fixed 5 Star Reward
    function renderTasks() {
      const container = document.getElementById('tasksList');
      if (!container) return;

      const tasks = getStoredTasks();
      const completedTasks = getStoredCompletedTasks();

      // "and fininshed task remove. new add automatically."
      const activeTasks = tasks.filter(t => t.active !== false && !completedTasks[t.id]);

      if (activeTasks.length === 0) {
        container.innerHTML = `
          <div class="empty-tasks-box">
            <div class="empty-tasks-icon">🎯</div>
            <div class="empty-tasks-text">All webtasks completed! Great job!</div>
            <div style="font-size: 0.72rem; color: #64748b; margin-top: 0.35rem;">New tasks added by admin will appear automatically.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = activeTasks.map(task => {
        const opened = isTaskOpened(task.id);

        let btnHtml = '';
        if (opened) {
          btnHtml = `<button type="button" class="btn-claim btn-task-verify" onclick="openVerifyModal('${task.id}')">Verify</button>`;
        } else {
          btnHtml = `<button type="button" class="btn-claim btn-task-open" onclick="handleOpenTask('${task.id}')">Open</button>`;
        }

        return `
          <div class="task-card" id="taskCard_${task.id}">
            <div class="task-icon-wrap">${task.icon || '⚡'}</div>
            <div class="task-info">
              <div class="task-name-row">
                <span class="task-name">${escapeHtml(task.title)}</span>
                <span class="task-status-pill ready">⭐ 5 Stars</span>
              </div>
              <div class="task-desc-row">
                <span class="task-reward" style="color: #facc15; font-weight: 800;">+5 ⭐</span>
                ${task.description ? `<span class="task-desc-sep">•</span><span class="task-desc-text">${escapeHtml(task.description)}</span>` : ''}
              </div>
            </div>
            <div class="task-action-wrap" id="action_${task.id}">
              ${btnHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // Open Button Click: opens link in new tab, changes button to Verify, opens modal
    window.handleOpenTask = function(taskId) {
      const tasks = getStoredTasks();
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      const targetLink = (task.link || task.url || '').trim();
      if (targetLink) {
        window.open(targetLink, '_blank');
      }

      setTaskOpened(taskId);

      const actionWrap = document.getElementById(`action_${taskId}`);
      if (actionWrap) {
        actionWrap.innerHTML = `<button type="button" class="btn-claim btn-task-verify" onclick="openVerifyModal('${taskId}')">Verify</button>`;
      }

      setTimeout(() => {
        openVerifyModal(taskId);
      }, 400);
    };

    let currentVerifyTaskId = null;

    window.openVerifyModal = function(taskId) {
      const tasks = getStoredTasks();
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      currentVerifyTaskId = taskId;

      const modal = document.getElementById('taskVerifyModalOverlay');
      const titleEl = document.getElementById('verifyModalTaskTitle');
      const descEl = document.getElementById('verifyModalTaskDesc');
      const iconEl = document.getElementById('verifyModalTaskIcon');
      const linkBtn = document.getElementById('verifyModalLinkBtn');
      const codeInput = document.getElementById('verifyCodeInput');
      const errorMsg = document.getElementById('verifyErrorMsg');

      if (titleEl) titleEl.textContent = task.title || 'Webtask Mission';
      if (descEl) descEl.textContent = task.description || 'Visit link & enter 6-digit code to win 5 ⭐';
      if (iconEl) iconEl.textContent = task.icon || '⚡';
      if (linkBtn) {
        const url = (task.link || task.url || '').trim();
        if (url) {
          linkBtn.href = url;
          linkBtn.style.display = 'inline-flex';
        } else {
          linkBtn.style.display = 'none';
        }
      }
      if (codeInput) {
        codeInput.value = '';
        codeInput.classList.remove('input-error');
      }
      if (errorMsg) {
        errorMsg.style.display = 'none';
        errorMsg.textContent = '';
      }

      if (modal) {
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
        setTimeout(() => {
          if (codeInput) codeInput.focus();
        }, 200);
      }
    };

    window.closeVerifyModal = function() {
      const modal = document.getElementById('taskVerifyModalOverlay');
      if (modal) {
        modal.classList.remove('active');
        setTimeout(() => {
          modal.style.display = 'none';
        }, 200);
      }
      currentVerifyTaskId = null;
    };

    window.handleVerifyModalBackdropClick = function(e) {
      if (e.target && e.target.id === 'taskVerifyModalOverlay') {
        closeVerifyModal();
      }
    };

    window.handleVerifyCodeInput = function(input) {
      if (!input) return;
      input.value = input.value.replace(/[^0-9]/g, '');
      const errorMsg = document.getElementById('verifyErrorMsg');
      if (errorMsg) errorMsg.style.display = 'none';
      input.classList.remove('input-error');
    };

    window.submitTaskVerification = function(event) {
      if (event) event.preventDefault();

      if (!currentVerifyTaskId) return;
      const tasks = getStoredTasks();
      const task = tasks.find(t => t.id === currentVerifyTaskId);
      if (!task) return;

      const codeInput = document.getElementById('verifyCodeInput');
      const errorMsg = document.getElementById('verifyErrorMsg');
      const userCode = (codeInput ? codeInput.value : '').trim();

      const correctCode = String(task.verificationCode || task.code || task.secretCode || '').trim();

      if (!userCode || (correctCode && userCode !== correctCode)) {
        if (codeInput) {
          codeInput.classList.add('input-error');
          codeInput.focus();
        }
        if (errorMsg) {
          errorMsg.style.display = 'block';
          errorMsg.textContent = '❌ Invalid 6-digit verification code. Please check and try again.';
        }
        return;
      }

      userStars += 5;
      localStorage.setItem('task_game_stars', userStars.toString());
      localStorage.setItem('user_stars', userStars.toString());

      let completedCount = parseInt(localStorage.getItem('task_game_total_tasks_completed') || '0', 10) + 1;
      localStorage.setItem('task_game_total_tasks_completed', completedCount.toString());
      localStorage.setItem('completed_tasks_count', completedCount.toString());
      recordLeaderboardEventTask(completedCount);

      markTaskCompleted(task.id);
      updateCoinDisplay();

      HomeAudio.playCoinClaim();
      const submitBtn = document.getElementById('btnVerifyConfirm');
      if (submitBtn) showFloatingCoin(submitBtn, '+5 ⭐ Won!');

      closeVerifyModal();

      const taskCard = document.getElementById(`taskCard_${task.id}`);
      if (taskCard) {
        taskCard.style.transition = 'all 0.35s ease';
        taskCard.style.opacity = '0';
        taskCard.style.transform = 'translateY(-10px) scale(0.96)';
        setTimeout(() => {
          renderTasks();
        }, 350);
      } else {
        renderTasks();
      }
    };

    const GLOBAL_EPOCH_ANCHOR = Date.UTC(2026, 9, 1, 0, 0, 0); // Oct 1, 2026 00:00:00 UTC
    const THREE_MONTHS_HOURS = 2160; // 90 days
    const THREE_MONTHS_MS = THREE_MONTHS_HOURS * 60 * 60 * 1000;

    function getUniversalGlobalLeaderboardEvent() {
      const now = Date.now();
      let customEvt = null;
      try {
        const raw = localStorage.getItem('task_game_leaderboard_event');
        if (raw) customEvt = JSON.parse(raw);
      } catch (e) {}

      // If manual override is active and not expired, respect it
      if (customEvt && customEvt.isManualOverride && now < customEvt.endTime && customEvt.status === 'active') {
        return customEvt;
      }

      // Universal Global 3-Month Season (Identical for ALL users worldwide: new, old, guest, logged-in)
      const elapsed = Math.max(0, now - GLOBAL_EPOCH_ANCHOR);
      const seasonIndex = Math.floor(elapsed / THREE_MONTHS_MS);
      const seasonNumber = seasonIndex + 1;
      const startTime = GLOBAL_EPOCH_ANCHOR + (seasonIndex * THREE_MONTHS_MS);
      const endTime = startTime + THREE_MONTHS_MS;

      const globalEvt = {
        id: `global_season_${seasonNumber}`,
        seasonNumber: seasonNumber,
        name: `Season ${seasonNumber}: 3-Month Championship (21,500 ⭐ Prize Pool)`,
        startTime: startTime,
        endTime: endTime,
        durationHours: THREE_MONTHS_HOURS,
        durationDays: 90,
        status: 'active',
        isGlobal: true
      };

      // Rollover check: If stored event is from an older season, reset task counters
      if (customEvt && customEvt.seasonNumber && customEvt.seasonNumber < seasonNumber) {
        localStorage.setItem('task_game_event_tasks_count', '0');
        try {
          const rawUsers = localStorage.getItem('task_game_users');
          if (rawUsers) {
            const uList = JSON.parse(rawUsers);
            if (Array.isArray(uList)) {
              uList.forEach(u => { u.eventTasks = 0; });
              localStorage.setItem('task_game_users', JSON.stringify(uList));
            }
          }
        } catch (e) {}
      }

      try {
        localStorage.setItem('task_game_leaderboard_event', JSON.stringify(globalEvt));
      } catch (e) {}

      return globalEvt;
    }

    function recordLeaderboardEventTask(totalTasks) {
      try {
        const now = Date.now();
        const evt = getUniversalGlobalLeaderboardEvent();

        if (evt.status === 'active' && now < evt.endTime) {
          // Task completion directly increments event tasks from task 1 (clean zero start)
          let eventTasks = parseInt(localStorage.getItem('task_game_event_tasks_count') || '0', 10) + 1;
          localStorage.setItem('task_game_event_tasks_count', eventTasks.toString());

          // Also update player entry in task_game_users
          try {
            const rawUsers = localStorage.getItem('task_game_users');
            if (rawUsers) {
              const users = JSON.parse(rawUsers);
              const myName = localStorage.getItem('player_username') || 'Task Earner';
              const me = users.find(u => u.id === 'usr_1' || u.name === myName || u.name === 'Task Earner' || u.name === 'NovaEarner' || u.name === 'Player');
              if (me) {
                me.eventTasks = eventTasks;
                me.totalTasks = totalTasks;
                localStorage.setItem('task_game_users', JSON.stringify(users));
              }
            }
          } catch (e) {}

          // Broadcast to other tabs (Leaderboard & Admin)
          try {
            const bc = new BroadcastChannel('nova_task_sync');
            bc.postMessage({ type: 'EVENT_TASK_COUNT', count: eventTasks, totalTasks: totalTasks });
            bc.close();
          } catch (e) {}
        } else if (now >= evt.endTime) {
          // 3-Month Timer finished -> Rollover to next global 3-month season!
          localStorage.setItem('task_game_event_tasks_count', '0');

          // Remove old event data from user pool
          try {
            const rawUsers = localStorage.getItem('task_game_users');
            if (rawUsers) {
              const users = JSON.parse(rawUsers);
              if (Array.isArray(users)) {
                users.forEach(u => { u.eventTasks = 0; });
                localStorage.setItem('task_game_users', JSON.stringify(users));
              }
            }
          } catch (e) {}

          localStorage.removeItem('task_game_leaderboard_event');
          const nextEvt = getUniversalGlobalLeaderboardEvent();

          try {
            const bc = new BroadcastChannel('nova_task_sync');
            bc.postMessage({ type: 'EVENT_FINISHED', nextEvent: nextEvt, timestamp: now });
            bc.close();
          } catch (e) {}
        }
      } catch (err) {
        console.error('Leaderboard event counting error:', err);
      }
    }

    // Initialize Page & Event Listeners
    function initHomePage() {
      updateCoinDisplay();
      renderTasks();

      // Start live 1-second countdown clock
      setInterval(updateLiveTimers, 1000);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initHomePage);
    } else {
      initHomePage();
    }

    // Real-Time Cross-Tab / Cross-Window Synchronization (Admin Edits -> Real-Time Player Screen Updates)
    window.addEventListener('storage', (e) => {
      if (e.key === TASKS_STORAGE_KEY || e.key === SYNC_FLAG_KEY || e.key === CLAIMS_STORAGE_KEY) {
        renderTasks();
      }
      if (e.key === 'task_game_coins' || e.key === 'task_game_stars' || e.key === 'player_username' || e.key === 'player_avatar') {
        updateCoinDisplay();
      }
    });

    // BroadcastChannel for instant same-browser cross-window sync
    try {
      const syncChannel = new BroadcastChannel(SYNC_CHANNEL_NAME);
      syncChannel.onmessage = () => {
        renderTasks();
        updateCoinDisplay();
      };
    } catch (e) {}

    // When tab gains focus, refresh tasks and coins
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        renderTasks();
        updateCoinDisplay();
      }
    });

    // Expose on window for Firebase Cloud Sync and Admin Real-Time Connection
    window.renderTasks = renderTasks;
    window.getStoredTasks = getStoredTasks;
    window.handleOpenTask = handleOpenTask;
    window.openVerifyModal = openVerifyModal;
    window.submitTaskVerification = submitTaskVerification;
  </script>
</body>
</html>
