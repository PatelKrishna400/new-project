<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest Game</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #f0f4f8;
        }

        #game-container {
            display: flex;
            height: calc(100vh - 60px);
            /* Minus nav */
            padding: 10px;
            gap: 10px;
        }

        #visual-area {
            flex: 1;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #blockly-area {
            flex: 1;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            position: relative;
        }

        #blockly-div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #grid-container {
            flex: 1;
            position: relative;
            background-color: #e0e0e0;
            margin: 10px;
            border-radius: 8px;
            /* Grid layout handled by JS */
        }

        .controls {
            padding: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            background: #eee;
        }

        .cell {
            position: absolute;
            background-size: cover;
            transition: all 0.3s ease;
        }

        .cell.wall {
            background-color: #546e7a;
            border-radius: 4px;
        }

        .cell.star {
            background-color: gold;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .player {
            position: absolute;
            transition: top 0.5s linear, left 0.5s linear, transform 0.5s ease;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <nav style="padding: 10px 20px;">
        <div class="container" style="margin: 0;">
            <a href="index.html" class="logo">⬅ Back to Dashboard</a>
            <div>
                <span>Level <span id="level-indicator">1</span></span>
            </div>
        </div>
    </nav>

    <div id="game-container">
        <div id="visual-area">
            <div id="grid-container">
                <!-- Grid Cells Generate Here -->
            </div>
            <div class="controls">
                <button id="btn-run" onclick="runCode()">▶ Run Code</button>
                <button id="btn-reset" onclick="resetLevel()" style="background-color: #FFB74D;">↺ Reset</button>
            </div>
        </div>
        <div id="blockly-area">
            <div id="blockly-div"></div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="modal">
        <div class="modal-content">
            <h2>🎉 Level Complete!</h2>
            <div style="font-size: 3em; margin: 10px;">⭐⭐⭐</div>
            <p>You used <span id="blocks-used">0</span> blocks.</p>
            <button onclick="nextLevel()">Next Level ➡</button>
            <br><br>
            <button onclick="closeModal()" style="background:#ccc; font-size: 0.9em;">Stay Here</button>
        </div>
    </div>

    <!-- Fail Modal -->
    <div id="fail-modal" class="modal">
        <div class="modal-content">
            <h2>❌ Oops!</h2>
            <p id="fail-message">Something went wrong.</p>
            <button onclick="resetLevel()">Try Again ↺</button>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
