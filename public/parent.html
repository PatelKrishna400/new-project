<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard - CodeQuest</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .parent-header {
            background-color: #263238;
            color: white;
            padding: 20px 0;
        }

        .stat-card {
            border-left: 5px solid var(--secondary-color);
        }
    </style>
</head>

<body>
    <header class="parent-header">
        <div class="container">
            <h1>Parent Dashboard</h1>
            <p>View your child's learning progress</p>
        </div>
    </header>

    <main class="container">
        <div class="card stat-card">
            <h3>Overview</h3>
            <p>Total Stars Earned: <strong id="p-stars">0</strong></p>
            <p>Badges Unlocked: <strong id="p-badges">0</strong></p>
            <p>Current Streak: <strong id="p-streak">0</strong> Days</p>
        </div>

        <div class="card">
            <h3>Detailed Progress</h3>
            <div id="progress-list">
                <!-- Level details -->
                <p>No activity recorded yet.</p>
            </div>
        </div>

        <a href="index.html" class="button" style="text-decoration:none; display:inline-block; margin-top:20px;">⬅ Back
            to Child Mode</a>
    </main>

    <script src="js/levels.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Logic to load user data (mirroring index.html)
            let user = { stars: 0, levelsCompleted: {}, badges: [], streak: 0 };
            try {
                // Try API first
                const res = await fetch('/api/progress/guest');
                if (res.ok) {
                    user = await res.json();
                } else {
                    throw new Error("API failed");
                }
            } catch (e) {
                // Fallback
                const localData = localStorage.getItem('codequest_user');
                if (localData) user = JSON.parse(localData);
            }

            document.getElementById('p-stars').textContent = user.stars;
            document.getElementById('p-badges').textContent = user.badges.length;
            document.getElementById('p-streak').textContent = user.streak || 0;

            const list = document.getElementById('progress-list');
            const completedIds = Object.keys(user.levelsCompleted).sort((a, b) => a - b);

            if (completedIds.length > 0) {
                list.innerHTML = '<table style="width:100%; text-align:left; border-collapse: collapse;"><thead><tr><th>Level</th><th>Stars</th><th>Blocks Used</th></tr></thead><tbody></tbody></table>';
                const tbody = list.querySelector('tbody');

                completedIds.forEach(id => {
                    const data = user.levelsCompleted[id];
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = "1px solid #eee";
                    tr.innerHTML = `
                        <td style="padding:10px;">Level ${id}</td>
                        <td style="padding:10px;">${'⭐'.repeat(data.stars)}</td>
                        <td style="padding:10px;">${data.blocksUsed}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        });
    </script>
</body>

</html>
