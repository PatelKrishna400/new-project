<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Coding Adventure</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(135deg, #e0f7fa 0%, #ffffff 100%);
            border-bottom: 2px solid var(--secondary-color);
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: white;
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .level-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: var(--secondary-color);
        }

        .level-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
            background: #eee;
        }

        .level-number {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .level-stars {
            color: #ccc;
        }

        .level-stars.earned {
            color: gold;
        }

        .parent-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 0.8em;
            opacity: 0.5;
            text-decoration: none;
            color: #999;
        }

        /* Streak Flame Animation */
        @keyframes flicker {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .streak-icon {
            display: inline-block;
            animation: flicker 1.5s infinite;
        }
    </style>
</head>

<body>

    <nav>
        <div class="container">
            <a href="#" class="logo">🚀 CodeQuest</a>
            <div class="menu">
                <span id="user-greeting">Hi, Explorer!</span>
            </div>
        </div>
    </nav>

    <header class="dashboard-header">
        <div class="container">
            <h1>Your Adventure Awaits!</h1>
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-value" id="star-count">0</div>
                    <div class="stat-label">Stars ⭐</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="badge-count">0</div>
                    <div class="stat-label">Badges 🏅</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value"><span class="streak-icon">🔥</span> <span id="streak-count">0</span></div>
                    <div class="stat-label">Day Streak</div>
                </div>
            </div>

            <div id="badge-display" style="margin-top: 15px; display: flex; justify-content: center; gap: 10px;">
                <!-- Badges will be injected here -->
            </div>
        </div>
    </header>

    <main class="container">
        <h2>Choose a Level</h2>
        <div class="level-grid" id="level-grid">
            <!-- Level cards generated by JS -->
            <div class="card">Loading levels...</div>
        </div>
    </main>

    <a href="parent.html" class="parent-link">Parent Dashboard</a>

    <script src="js/levels.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Fetch User Progress
            let user = { stars: 0, levelsCompleted: {}, badges: [], streak: 0 };
            try {
                const res = await fetch('/api/progress/guest');
                if (!res.ok) throw new Error("API not ok");
                user = await res.json();
            } catch (e) {
                console.warn("Could not load progress from server, using localStorage", e);
                const localData = localStorage.getItem('codequest_user');
                if (localData) {
                    user = JSON.parse(localData);
                }
            }

            // Update Header Stats
            document.getElementById('star-count').textContent = user.stars;
            document.getElementById('badge-count').textContent = user.badges.length;
            document.getElementById('streak-count').textContent = user.streak;

            // Render Badges
            const badgeContainer = document.getElementById('badge-display');
            user.badges.forEach(badge => {
                const b = document.createElement('span');
                b.className = 'badge';
                b.textContent = badge;
                badgeContainer.appendChild(b);
            });

            // Render Levels
            const grid = document.getElementById('level-grid');
            grid.innerHTML = ''; // Clear loading

            // LEVELS global comes from levels.js
            Object.keys(LEVELS).forEach(levelId => {
                const levelData = LEVELS[levelId];
                const isLocked = levelId > 1 && !user.levelsCompleted[levelId - 1];
                const completedData = user.levelsCompleted[levelId];

                const card = document.createElement('div');
                card.className = `level-card ${isLocked ? 'locked' : ''}`;

                let starsHtml = '';
                for (let i = 0; i < 3; i++) {
                    const earned = completedData && i < completedData.stars;
                    starsHtml += `<span class="level-stars ${earned ? 'earned' : ''}">★</span>`;
                }

                card.innerHTML = `
                    <div class="level-number">${levelId}</div>
                    <div class="level-stars-container">${starsHtml}</div>
                    ${completedData ? '<small style="color:green;">Completed!</small>' : ''}
                `;

                if (!isLocked) {
                    card.onclick = () => window.location.href = `game.html?level=${levelId}`;
                }

                grid.appendChild(card);
            });
        });
    </script>
</body>

</html>
