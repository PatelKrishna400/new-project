<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frontend — Mobile View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030816;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }

    /* Mobile Screen Viewport Container */
    .mobile-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: #060e24;
      border-left: 1px solid rgba(56, 189, 248, 0.15);
      border-right: 1px solid rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(56, 189, 248, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 74px; /* Space for the below menu bar */
    }

    .page-content {
      flex: 1;
      width: 100%;
    }

    /* Below Menu Bar (Frontend Only) */
    .below-menu-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      height: 72px;
      background: rgba(6, 14, 36, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
      border-left: 1px solid rgba(56, 189, 248, 0.15);
      border-right: 1px solid rgba(56, 189, 248, 0.15);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(56, 189, 248, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 0.5rem;
      z-index: 1000;
    }

    .below-menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      background: none;
      border: none;
      color: #94a3b8;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0.35rem 0.6rem;
      border-radius: 12px;
      transition: all 0.2s ease;
      text-decoration: none;
      flex: 1;
    }

    .menu-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      border: 1px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .below-menu-item:hover .menu-icon-wrap,
    .below-menu-item.active .menu-icon-wrap {
      background: linear-gradient(135deg, #475569 0%, #334155 100%);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 16px rgba(56, 189, 248, 0.35);
      transform: translateY(-2px);
    }

    .below-menu-item.active .menu-label {
      color: #38bdf8;
    }

    .menu-label {
      letter-spacing: 0.02em;
    }

    /* Center Home Button */
    .center-home-btn {
      position: relative;
      top: -10px;
    }

    .center-home-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #475569 0%, #1e293b 100%);
      border: 2px solid #38bdf8;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6), 0 0 16px rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      transition: all 0.2s ease;
      margin-bottom: 2px;
    }

    .center-home-btn:hover .center-home-icon-wrap,
    .center-home-btn.active .center-home-icon-wrap {
      background: linear-gradient(135deg, #64748b 0%, #334155 100%);
      border-color: #38bdf8;
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 24px rgba(56, 189, 248, 0.5);
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Mobile View Screen Shell -->
  <div class="mobile-container">
    
    <!-- Page Content (Plain Dark Blue) -->
    <main class="page-content">
    </main>

    <!-- Below Menu Bar (Frontend Only) -->
    <nav class="below-menu-bar" id="belowMenuBar" aria-label="Bottom Navigation">
      
      <!-- Leaderboard Page Link -->
      <a href="page/leaderboard/index.html" class="below-menu-item" id="menuLeaderboard" title="Leaderboard">
        <div class="menu-icon-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M18 14.66V17c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
          </svg>
        </div>
        <span class="menu-label">Leaderboard</span>
      </a>

      <!-- Home Page Link (Center) -->
      <a href="page/home/index.html" class="below-menu-item center-home-btn active" id="menuHome" title="Home">
        <div class="center-home-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span class="menu-label">Home</span>
      </a>

      <!-- Profile Page Link -->
      <a href="page/profile/index.html" class="below-menu-item" id="menuProfile" title="Profile">
        <div class="menu-icon-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="menu-label">Profile</span>
      </a>

    </nav>

  </div>

</body>
</html>
