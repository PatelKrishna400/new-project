<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frontend — Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile View Screen Shell -->
  <div class="mobile-container">
    
    <!-- Top Header Bar -->
    <header class="home-header">
      <div class="header-user">
        <div class="user-avatar">🏆</div>
        <div class="user-meta">
          <span class="user-name">NovaEarner</span>
          <span class="user-level">GLOBAL RANKS</span>
        </div>
      </div>
      <div class="coin-pill">
        <span>🪙</span>
        <span class="coin-value" id="leaderboardCoinsTop">0</span>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <div class="tasks-banner">
        <h1 class="tasks-title">Top Players</h1>
        <p class="tasks-subtitle">Season leaderboard rankings and stats</p>
      </div>

      <div class="leaderboard-list">
        <div class="leader-card">
          <span class="leader-rank rank-1">#1</span>
          <div class="leader-info">
            <div class="leader-name">VortexTyper 🥇</div>
            <div class="leader-sub">138 WPM • 99.4% Acc</div>
          </div>
          <span class="leader-coins">42,850 🪙</span>
        </div>

        <div class="leader-card">
          <span class="leader-rank rank-2">#2</span>
          <div class="leader-info">
            <div class="leader-name">CyberKey 🥈</div>
            <div class="leader-sub">124 WPM • 98.9% Acc</div>
          </div>
          <span class="leader-coins">38,120 🪙</span>
        </div>

        <div class="leader-card">
          <span class="leader-rank rank-3">#3</span>
          <div class="leader-info">
            <div class="leader-name">QuantumFingers 🥉</div>
            <div class="leader-sub">119 WPM • 98.2% Acc</div>
          </div>
          <span class="leader-coins">31,400 🪙</span>
        </div>

        <div class="leader-card highlight-me">
          <span class="leader-rank">#14</span>
          <div class="leader-info">
            <div class="leader-name">NovaEarner (You)</div>
            <div class="leader-sub">92 WPM • 96.8% Acc</div>
          </div>
          <span class="leader-coins" id="userLeaderboardCoins">0 🪙</span>
        </div>
      </div>
    </main>

    <!-- Below Menu Bar (Shop, Leaderboard Active, Home Center, Wallet, Profile) -->
    <nav class="below-menu-bar" id="belowMenuBar" aria-label="Bottom Navigation">
      
      <!-- 1. Shop Page Link -->
      <a href="../shop/index.html" class="below-menu-item" id="menuShop" title="Shop">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span class="menu-label">Shop</span>
      </a>

      <!-- 2. Leaderboard Page Link (Active) -->
      <a href="../leaderboard/index.html" class="below-menu-item active" id="menuLeaderboard" title="Leaderboard">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M18 14.66V17c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
          </svg>
        </div>
        <span class="menu-label">Ranks</span>
      </a>

      <!-- 3. Home Page Link (Center) -->
      <a href="../home/index.html" class="below-menu-item center-home-btn" id="menuHome" title="Home">
        <div class="center-home-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span class="menu-label">Home</span>
      </a>

      <!-- 4. Wallet Page Link -->
      <a href="../wallet/index.html" class="below-menu-item" id="menuWallet" title="Wallet">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
          </svg>
        </div>
        <span class="menu-label">Wallet</span>
      </a>

      <!-- 5. Profile Page Link -->
      <a href="../profile/index.html" class="below-menu-item" id="menuProfile" title="Profile">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="menu-label">Profile</span>
      </a>

    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
