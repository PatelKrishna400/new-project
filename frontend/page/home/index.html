<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Earner — Webtask</title>
  <script>
    // Initialize local defaults only if not already set, preserving real balances
    try {
      if (localStorage.getItem('task_game_coins') === null) localStorage.setItem('task_game_coins', '0');
      if (localStorage.getItem('task_game_stars') === null) localStorage.setItem('task_game_stars', '0');
      if (localStorage.getItem('user_coins') === null) localStorage.setItem('user_coins', localStorage.getItem('task_game_coins') || '0');
      if (localStorage.getItem('user_stars') === null) localStorage.setItem('user_stars', localStorage.getItem('task_game_stars') || '0');
      if (localStorage.getItem('completed_tasks_count') === null) localStorage.setItem('completed_tasks_count', '0');
      if (localStorage.getItem('ads_watched_count') === null) localStorage.setItem('ads_watched_count', '0');

      if (!localStorage.getItem('task_game_legacy_mock_cleared')) {
        localStorage.removeItem('ENERGY_TAP_SUNFLOWER_STATE_V4');
        localStorage.removeItem('sunflower_state');
        localStorage.removeItem('task_game_stars_rating');
        const existingName = localStorage.getItem('player_username');
        if (!existingName || existingName.toLowerCase().includes('nova') || existingName === 'Demo User') {
          localStorage.setItem('player_username', 'Player');
        }
        if (!localStorage.getItem('player_avatar')) {
          localStorage.setItem('player_avatar', '⚡');
        }
        localStorage.setItem('task_game_legacy_mock_cleared', 'true');
      }
    } catch (e) {}
  </script>
  <!-- Firebase SDK & Analytics Connection -->
  <script type="module" src="../../firebase-config.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile View Screen Shell -->
  <div class="mobile-container">
    
    <!-- Top Header Bar -->
    <header class="home-header">
      <div class="header-user">
        <div class="user-avatar">⚡</div>
        <div class="user-meta">
          <span class="user-name">Task Earner</span>
          <span class="user-level" id="userRankDisplay">RANK #1</span>
        </div>
      </div>
      <div class="header-pills">
        <div class="coin-pill" id="coinPill" title="Total Coin Balance • Tap to manage" onclick="window.openBalanceManageModal && window.openBalanceManageModal('coins')">
          <span>🪙</span>
          <span class="coin-value" id="userCoinsDisplay">0</span>
        </div>
        <div class="star-pill" id="starPill" title="Total Star Balance • Tap to manage" onclick="window.openBalanceManageModal && window.openBalanceManageModal('stars')">
          <span>⭐</span>
          <span class="star-value" id="userStarsDisplay">0</span>
        </div>
      </div>
    </header>

    <!-- Page Content (Tasks) -->
    <main class="page-content">
      

      <!-- Games Featured Interactive Tab Card -->
      <a href="../games/index.html" class="games-feature-tab" id="gamesHeroTab" title="Open Gaming Arena">
        <div class="games-tab-content">
          <div class="games-badge-row">
            <span class="games-live-pill">● LIVE ARENA</span>
            <span class="games-win-pill">🌻 20 LANDS TYCOON</span>
          </div>
          <h2 class="games-tab-heading">Games</h2>
          <div class="games-cta-btn">
            <span>Play Games</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </div>
        <div class="games-tab-art">
          <img src="../games/assets/games_banner.jpg" alt="Games Arena" class="games-art-img" />
          <div class="games-art-overlay"></div>
        </div>
      </a>

      <!-- Tasks Section Header -->
      <div class="tasks-banner">
        <h1 class="tasks-title">Webtask</h1>
      </div>

      <!-- Tasks List -->
      <div class="tasks-list" id="tasksList">
        <!-- Dynamically loaded & synchronized with Admin in real time -->
      </div>

    </main>

    <!-- Below Menu Bar (Shop, Leaderboard, Home Center, Wallet, Profile) -->
    <nav class="below-menu-bar" id="belowMenuBar" aria-label="Bottom Navigation">
      
      <!-- 1. Shop Page Link (Beside Leaderboard) -->
      <a href="../shop/index.html" class="below-menu-item" id="menuShop" title="Shop">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span class="menu-label">Shop</span>
      </a>

      <!-- 2. Leaderboard Page Link -->
      <a href="../leaderboard/index.html" class="below-menu-item" id="menuLeaderboard" title="Leaderboard">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M18 14.66V17c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
          </svg>
        </div>
        <span class="menu-label">Ranks</span>
      </a>

      <!-- 3. Home Page Link (Center Elevated) -->
      <a href="../home/index.html" class="below-menu-item center-home-btn active" id="menuHome" title="Home">
        <div class="center-home-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span class="menu-label">Home</span>
      </a>

      <!-- 4. Wallet Page Link (Between Home and Profile) -->
      <a href="../wallet/index.html" class="below-menu-item" id="menuWallet" title="Wallet">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
          </svg>
        </div>
        <span class="menu-label">Wallet</span>
      </a>

      <!-- 5. Profile Page Link -->
      <a href="../profile/index.html" class="below-menu-item" id="menuProfile" title="Profile">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="menu-label">Profile</span>
      </a>

    </nav>

  </div>

  <!-- 6-Digit Code Task Verification Modal -->
  <div class="task-verify-modal-overlay" id="taskVerifyModalOverlay" style="display: none;" onclick="handleVerifyModalBackdropClick(event)">
    <div class="task-verify-modal-box" onclick="event.stopPropagation()">
      <button type="button" class="verify-modal-close-btn" onclick="closeVerifyModal()" aria-label="Close modal">✕</button>
      
      <div class="verify-modal-header">
        <div class="verify-modal-badge">
          <span class="verify-badge-dot"></span>
          <span>WEBTASK VERIFICATION</span>
        </div>
        <h2 class="verify-modal-title">Enter 6-Digit Code</h2>
        <div class="verify-modal-reward-badge">
          <span>Fixed Reward:</span>
          <span class="reward-highlight">+5 ⭐</span>
        </div>
      </div>

      <div class="verify-modal-task-card">
        <div class="verify-card-icon" id="verifyModalTaskIcon">⚡</div>
        <div class="verify-card-info">
          <div class="verify-card-title" id="verifyModalTaskTitle">Webtask Mission</div>
          <div class="verify-card-sub" id="verifyModalTaskDesc">Visit link &amp; get code from admin</div>
        </div>
        <a href="#" target="_blank" class="btn-verify-reopen-link" id="verifyModalLinkBtn" title="Re-open link in new tab">Open ↗</a>
      </div>

      <form class="verify-form" onsubmit="submitTaskVerification(event)">
        <div class="verify-code-input-container">
          <label class="verify-code-label" for="verifyCodeInput">Verification Code (6 Digits)</label>
          <input 
            type="text" 
            id="verifyCodeInput" 
            class="verify-code-input font-mono" 
            maxlength="6" 
            pattern="[0-9]{6}" 
            inputmode="numeric" 
            placeholder="000000" 
            autocomplete="off"
            required
            oninput="handleVerifyCodeInput(this)"
          >
          <div class="verify-code-hint">Enter the 6-digit verification code for this task</div>
          <div class="verify-error-msg" id="verifyErrorMsg" style="display: none;"></div>
        </div>

        <div class="verify-modal-btn-row">
          <button type="button" class="btn-verify-cancel" onclick="closeVerifyModal()">Cancel</button>
          <button type="submit" class="btn-verify-confirm" id="btnVerifyConfirm">Verify &amp; Win 5 ⭐</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Cloud Sync & Analytics Connection -->
  <script type="module" src="../../firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
