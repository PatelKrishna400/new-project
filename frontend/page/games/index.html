<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frontend — Gaming Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile View Screen Shell -->
  <div class="mobile-container">
    
    <!-- Top Header Bar -->
    <header class="home-header">
      <div class="header-user">
        <a href="../home/index.html" class="header-back-btn" title="Back to Home" style="text-decoration:none; display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px; background:#0a1738; border:1.5px solid #38bdf8; color:#38bdf8; margin-right:2px; box-shadow:0 2px 6px rgba(0,0,0,0.5); transition:all 0.2s ease;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
      </div>
      <div class="header-pills">
        <div class="coin-pill" title="Coin Balance">
          <span>🪙</span>
          <span class="coin-value" id="gameCoinsDisplay">0</span>
        </div>
        <div class="star-pill" title="Star Balance">
          <span>⭐</span>
          <span class="star-value" id="gameStarsDisplay">0</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">


      <!-- Section Title -->
      <div class="section-title-row">
        <h2 class="section-title">Games</h2>
        <span class="section-tag">Tap to Open</span>
      </div>

      <!-- ========================================================
           HONEY BEE FARM GAME TAB (CLICK TO OPEN HONEY FARM)
           ======================================================== -->
      <a href="../sunflower/index.html" class="sunflower-game-tab" id="sunflowerGameTab" title="Click to Open Honey Bee Farm">
        

        <!-- Main Banner Artwork Stage -->
        <div class="tab-artwork-stage">
          <img src="../sunflower/sunflower-bg.png" alt="Honey Bee Farm Panorama" class="tab-artwork-img" />
          <div class="tab-artwork-vignette"></div>
          <div class="tab-artwork-overlay-content">
            <div class="tab-floating-icon">🍯</div>
            <div class="tab-artwork-titles">
              <h3 class="tab-title">Honey Bee Farm</h3>
            </div>
          </div>
        </div>

        <!-- Tab Body Details -->
        <div class="tab-body">
          <!-- Live Balances Preview -->
          <div class="tab-stats-preview">
            <div class="tab-stat-pill">
              <span class="pill-label">Honey Pots</span>
              <span class="pill-value text-amber" id="tabSfCoins">0 🍯</span>
            </div>
            <div class="tab-stat-pill">
              <span class="pill-label">Seeds Ready</span>
              <span class="pill-value text-emerald" id="tabSfSeeds">3 🌱</span>
            </div>
            <div class="tab-stat-pill">
              <span class="pill-label">Flower Groves</span>
              <span class="pill-value text-sky" id="tabSfBuckets">20 🌸</span>
            </div>
          </div>

          <!-- 3D Interactive Launch Button -->
          <div class="tab-action-wrap">
            <div class="btn-launch-game">
              <span class="launch-icon">🐝</span>
              <span class="launch-text">CLICK TO OPEN HONEY BEE FARM</span>
              <svg class="launch-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </div>

        </div>
      </a>

    </main>

    <!-- Below Menu Bar (Shop, Leaderboard, Home Center, Wallet, Profile) -->
    <nav class="below-menu-bar" id="belowMenuBar" aria-label="Bottom Navigation">
      
      <!-- 1. Shop Page Link -->
      <a href="../shop/index.html" class="below-menu-item" id="menuShop" title="Shop">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span class="menu-label">Shop</span>
      </a>

      <!-- 2. Leaderboard Page Link -->
      <a href="../leaderboard/index.html" class="below-menu-item" id="menuLeaderboard" title="Leaderboard">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M18 14.66V17c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-2.34"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
          </svg>
        </div>
        <span class="menu-label">Ranks</span>
      </a>

      <!-- 3. Home Page Link (Center) -->
      <a href="../home/index.html" class="below-menu-item center-home-btn active" id="menuHome" title="Home">
        <div class="center-home-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span class="menu-label">Home</span>
      </a>

      <!-- 4. Wallet Page Link -->
      <a href="../wallet/index.html" class="below-menu-item" id="menuWallet" title="Wallet">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
          </svg>
        </div>
        <span class="menu-label">Wallet</span>
      </a>

      <!-- 5. Profile Page Link -->
      <a href="../profile/index.html" class="below-menu-item" id="menuProfile" title="Profile">
        <div class="menu-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="menu-label">Profile</span>
      </a>

    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
